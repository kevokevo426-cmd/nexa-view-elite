<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tasks - NEXA VIEW ELITE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{background:#050507;color:#fff;font-family:system-ui;margin:0;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#111,#1a1a00);padding:12px;border-radius:12px;border:1px solid #fbbf24;margin-bottom:12px}
.bal{color:#fbbf24;font-weight:900;font-size:16px}
.task{background:#101010;border:1px solid #222;border-radius:14px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;transition:0.2s}
.task:hover{border-color:#fbbf24}
.task-left{flex:1}.task-left h4{margin:0;color:#fff;font-size:13px}.task-left small{color:#888;font-size:10px}
.btn{padding:10px 18px;border-radius:20px;border:0;font-weight:800;cursor:pointer;font-size:11px}.btn-gold{background:#fbbf24;color:#000}.btn-done{background:#22c55e;color:#000}.btn-lock{background:#222;color:#555}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:99}.modal-box{background:#111;border:1px solid #fbbf24;border-radius:18px;padding:20px;width:95%;max-width:400px;text-align:center}
.progressBar{background:#222;height:8px;border-radius:20px;overflow:hidden;margin:14px 0}.progressBar div{height:100%;background:#fbbf24;width:0%;transition:width 1s linear}
</style>
</head>
<body>
<div class="header">
<div><b style="color:#fbbf24">👑 ELITE TASKS</b><br><small style="color:#888;font-size:9px">Daily Premium Earning</small></div>
<div style="text-align:right"><div class="bal" id="balance">Ksh 0</div><div style="color:#888;font-size:9px" id="uid"></div></div>
</div>

<div style="background:#0f1f0f;border:1px dashed #22c55e;color:#22c55e;padding:10px;border-radius:12px;text-align:center;font-size:11px;margin-bottom:12px">
✅ Watch 30 seconds • Earn instantly • Added to balance • Google verified
</div>

<div id="taskList">Loading premium tasks...</div>

<div style="text-align:center;margin:16px 0"><a href="dashboard.html" style="color:#888;text-decoration:none;font-size:13px">← Back to Dashboard</a></div>

<div id="watchModal" class="modal">
<div class="modal-box">
<h3 style="color:#fbbf24">📺 Watching Elite Ad...</h3>
<p id="watchTitle" style="color:#888;font-size:12px"></p>
<div class="progressBar"><div id="watchProgress"></div></div>
<p id="timer" style="color:#fbbf24;font-weight:800;font-size:20px">30s</p>
<p style="color:#555;font-size:10px">Don't close • Earning will auto-add</p>
<button id="claimBtn" class="btn btn-gold" style="display:none;width:100%;margin-top:12px" onclick="claimReward()">🎉 Claim Ksh <span id="rewardAmt"></span></button>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const auth=auth= firebase.auth(); const db=firebase.firestore();
let currentUser=null; let currentTask=null; let tasksData=[];

const premiumTasks=[
 {id:1,title:"Premium Tech Review",reward:60,duration:30},
 {id:2,title:"Elite Fashion Ad",reward:80,duration:30},
 {id:3,title:"Crypto Premium",reward:100,duration:30},
 {id:4,title:"Nairobi Elite Promo",reward:50,duration:30},
 {id:5,title:"Safari Premium",reward:70,duration:30},
];

auth.onAuthStateChanged(user=>{
 if(!user){ location.href="register.html"; return; }
 currentUser=user;
 db.collection("users").doc(user.email).onSnapshot(d=>{
  if(d.exists){
   document.getElementById('balance').innerText="Ksh "+(d.data().balance||0);
   document.getElementById('uid').innerText=d.data().userId||"";
  }
 });
 loadTasks();
});

function loadTasks(){
 // Check which tasks done today
 let today=new Date().toISOString().split('T')[0];
 db.collection("taskClaims").where("email","==",currentUser.email).where("date","==",today).get().then(snap=>{
  let doneIds={}; snap.forEach(doc=>{ doneIds[doc.data().taskId]=true; });
  let html="";
  premiumTasks.forEach(t=>{
   let done=doneIds[t.id];
   html+=`<div class="task" style="${done?'opacity:0.5;border-color:#22c55e':''}">
   <div class="task-left"><h4>${done?'✅':''} ${t.title}</h4><small>Watch ${t.duration}s • Earn Ksh ${t.reward} • Elite Ad</small></div>
   <button class="${done?'btn btn-done':'btn btn-gold'}" ${done?'disabled':''} onclick="startWatch(${t.id})">${done?'Done':'Watch'}</button>
   </div>`;
  });
  document.getElementById('taskList').innerHTML=html;
 });
}

function startWatch(taskId){
 currentTask=premiumTasks.find(t=>t.id===taskId);
 document.getElementById('watchTitle').innerText=currentTask.title;
 document.getElementById('rewardAmt').innerText=currentTask.reward;
 document.getElementById('watchModal').style.display='flex';
 document.getElementById('claimBtn').style.display='none';
 document.getElementById('watchProgress').style.width='0%';
 let timeLeft=currentTask.duration;
 let interval=setInterval(()=>{
  timeLeft--;
  document.getElementById('timer').innerText=timeLeft+'s';
  document.getElementById('watchProgress').style.width=((currentTask.duration-timeLeft)/currentTask.duration*100)+'%';
  if(timeLeft<=0){
   clearInterval(interval);
   document.getElementById('timer').innerText='Done!';
   document.getElementById('claimBtn').style.display='block';
  }
 },1000);
}

function claimReward(){
 let today=new Date().toISOString().split('T')[0];
 db.collection("taskClaims").add({
  email:currentUser.email,
  taskId:currentTask.id,
  reward:currentTask.reward,
  title:currentTask.title,
  date:today,
  createdAt:firebase.firestore.FieldValue.serverTimestamp()
 }).then(()=>{
  db.collection("users").doc(currentUser.email).update({
   balance:firebase.firestore.FieldValue.increment(currentTask.reward),
   totalEarned:firebase.firestore.FieldValue.increment(currentTask.reward)
  });
  document.getElementById('watchModal').style.display='none';
  alert("🎉 Ksh "+currentTask.reward+" added to balance!");
  loadTasks();
 });
}
</script>
</body>
</html>
