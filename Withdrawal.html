<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw - NEXA ELITE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{background:#050507;color:#fff;font-family:system-ui;margin:0;padding:14px}.box{background:#101010;border:1px solid #222;border-radius:14px;padding:16px;margin:12px 0}input{width:100%;padding:13px;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;margin:6px 0}.btn{width:100%;padding:14px;background:#22c55e;color:#000;border:0;border-radius:30px;font-weight:800}.hist{background:#151515;border:1px solid #222;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;font-size:12px}.balCard{background:#111;border:1px solid #fbbf24;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}</style>
</head><body>
<div class="balCard"><small style="color:#888">Available Balance</small><h1 id="bal" style="color:#fbbf24;margin:6px 0">Ksh 0</h1><small style="color:#22c55e">Min Ksh 200 • 10% fee • Paid in 1 hour</small></div>
<div class="box"><h3 style="color:#22c55e;margin:0 0 8px">💸 Request Withdrawal</h3>
<input id="amt" type="number" placeholder="Amount to withdraw"><input id="phone" placeholder="M-PESA Number to receive">
<button class="btn" onclick="submitWith()">Request Withdrawal</button><p id="msg" style="font-size:11px;text-align:center;color:#22c55e"></p></div>
<div class="box"><h3 style="color:#f97316">💸 My Withdrawal History</h3><div id="history">Loading...</div></div>
<div style="text-align:center"><a href="wallet.html" style="color:#888;text-decoration:none">← Back to Wallet</a></div>
<script>
const firebaseConfig={apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.firestore();let cur=null;
auth.onAuthStateChanged(u=>{if(!u)location.href="register.html";else{cur=u;db.collection("users").doc(u.email).onSnapshot(d=>{if(d.exists)document.getElementById('bal').innerText="Ksh "+(d.data().balance||0)});loadHist();}});
function submitWith(){let a=parseInt(document.getElementById('amt').value),p=document.getElementById('phone').value.trim();if(!a||!p)return alert("Fill all");if(a<200)return alert("Min 200");db.collection("withdrawals").add({email:cur.email,phone:cur.email,amount:a,receivingPhone:p,status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{document.getElementById('msg').innerText="✅ Requested - Admin will pay";document.getElementById('amt').value="";document.getElementById('phone').value="";})}
function loadHist(){db.collection("withdrawals").where("email","==",cur.email).orderBy("createdAt","desc").limit(30).onSnapshot(s=>{let h="";s.forEach(d=>{let x=d.data();h+=`<div class="hist"><div><b>Ksh ${x.amount}</b><br><small>${x.receivingPhone||''}</small></div><div style="color:${x.status=='pending'?'#f97316':'#22c55e'};font-weight:800">${x.status.toUpperCase()}</div></div>`});document.getElementById('history').innerHTML=h||"No withdrawals";})}
</script></body></html>
