<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Join - NEXA VIEW ELITE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{background:#050507;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:14px}
.card{background:#101010;border:1px solid #fbbf24;border-radius:22px;padding:32px;width:100%;max-width:380px;text-align:center;box-shadow:0 0 40px rgba(251,191,36,0.12)}
.logo{color:#fbbf24;font-weight:900;font-size:22px}
.sub{color:#888;font-size:11px;margin:8px 0 20px}
.gbtn{background:#fff;color:#000;border:0;padding:14px;width:100%;border-radius:30px;font-weight:800;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px}
input{width:100%;padding:13px;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff;margin-top:14px}
#msg{color:#ef4444;font-size:11px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div class="card">
<div class="logo">👑 NEXA VIEW ELITE</div>
<div class="sub">PREMIUM • GOOGLE VERIFIED ONLY</div>
<button class="gbtn" onclick="googleJoin()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">Continue with Google</button>
<input type="text" id="refCode" placeholder="Referral Code (e.g NEXA-ABC123)">
<p id="msg"></p>
<a href="login.html" style="color:#888;font-size:12px;text-decoration:none;display:block;margin-top:16px">Already have account? <b style="color:#fbbf24">Login</b></a>
</div>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyCICiaqFBAv5b82cYLYaWLWgZgeNIH8Dr0",
    authDomain: "nexa-view-elite.firebaseapp.com",
    databaseURL: "https://nexa-view-elite-default-rtdb.firebaseio.com",
    projectId: "nexa-view-elite",
    storageBucket: "nexa-view-elite.firebasestorage.app",
    messagingSenderId: "436160553921",
    appId: "1:436160553921:web:19c4d8add792ac36d54540",
    measurementId: "G-Q9YTKYG7DH"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

async function googleJoin(){
 const provider=new firebase.auth.GoogleAuthProvider();
 document.getElementById('msg').innerText="Opening Google...";
 try{
  const result=await auth.signInWithPopup(provider);
  const user=result.user;
  const refCode=document.getElementById('refCode').value.trim().toUpperCase();
  const userRef=db.collection("users").doc(user.email);
  const snap=await userRef.get();
  if(!snap.exists){
   await userRef.set({
    email:user.email, displayName:user.displayName||"", photo:user.photoURL||"",
    balance:0, totalEarned:0, userId:"NEXA-"+Math.random().toString(36).substr(2,6).toUpperCase(),
    referredBy:refCode||null, createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    isGoogleVerified:true
   });
   if(refCode){ await db.collection("referrals").add({from:refCode,to:user.email,level:"L1",status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }
  }
  localStorage.setItem("nexa_email", user.email);
  location.href="dashboard.html";
 }catch(e){
  console.error(e);
  document.getElementById('msg').innerText=e.code+": "+e.message;
 }
}
</script>
</body>
</html>
